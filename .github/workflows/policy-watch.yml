name: policy-watch

# 주 1회 정책·세제 값 팩트체크 (Claude + web_search).
# 변경 감지 → 이슈 자동 생성(사람이 검토 후 PR). 변경 없음 → 검증일(lastVerified) 갱신 커밋.
on:
  schedule:
    - cron: "0 0 * * 1" # 매주 월 00:00 UTC = 09:00 KST
  workflow_dispatch: {} # 수동 실행 버튼

permissions:
  contents: write # lastVerified 갱신 커밋·푸시
  issues: write # 변경 감지 시 이슈 생성

concurrency:
  group: policy-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 앱 의존성과 분리 — SDK만 즉석 설치(--ignore-scripts 로 prisma postinstall 등 미실행)
      - run: npm install --no-save --ignore-scripts @anthropic-ai/sdk

      - name: Fact-check policy values
        id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POLICY_WATCH_MODEL: ${{ vars.POLICY_WATCH_MODEL }} # (선택) 모델 override
        run: node scripts/policy-watch.mjs

      - name: Open issue on suspected change
        if: steps.check.outputs.result == 'changed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue create --title "정책·세제 변경 의심 ($(date +%F))" --body-file .policy-watch-issue.md

      - name: Commit freshness bump if all current
        if: steps.check.outputs.result == 'current'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/policyLoan.ts
          git diff --cached --quiet || (git commit -m "chore: 정책 검증일 갱신 (policy-watch — 변경 없음 확인)" && git push)
