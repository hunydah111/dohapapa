name: weekly-data-refresh

# 매주 일요일 새벽 6시(KST) 실거래 증분 갱신 → 스냅샷 등 JSON 커밋 → Vercel 자동 배포.
# 일 06:00 KST = 토 21:00 UTC → cron "0 21 * * 6". 수동 실행도 가능(workflow_dispatch).
# 주 1회인 이유: MOLIT 실거래는 월 단위로 변하고, 앱이 읽는 complexSnapshot.json 이 6.6MB라
# 매일 커밋하면 깃 히스토리가 폭증한다. 주 1회면 신선도 충분 + 저장/배포 비용 절감.
on:
  schedule:
    - cron: "0 21 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weekly-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul # 기존 KST 적재분과 dealDate·월버킷 일치 (중복 방지의 핵심)
      # 스크립트는 직결(direct) 연결을 쓴다 — 대량 삽입·트랜잭션에 pgbouncer 회피.
      DATABASE_URL: ${{ secrets.DIRECT_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
      KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate

      # 1) 매매 실거래 — 최근 2개월만 시군구별 원자적 교체(멱등). 신규 단지는 find-or-create.
      - run: npx tsx scripts/fetch-molit.ts --gu=all --refresh-recent=2
      # 2) 신규 단지만 좌표/학교거리 보강(증분, 저비용).
      - run: npx tsx scripts/geocode-complexes.ts
      - run: npx tsx scripts/enrich-schools.ts
      # 3) 번들에 박히는 JSON 재생성(추세지수 + 첫화면 갱신일).
      - run: npx tsx scripts/build-trend-index.ts
      - run: npx tsx scripts/build-data-meta.ts
      # 4) 앱이 런타임에 읽는 단지 스냅샷 재생성(Neon 에서 읽음, build-trend-index 다음).
      #    ★ 이 단계가 빠지면 갱신분이 사이트에 반영되지 않는다 — 런타임은 DB 가 아니라 이 JSON 만 읽음.
      - run: npx tsx scripts/build-snapshot.ts
      # 4b) 동네 자존심 리그 테이블 — 번들 trendIndex+snapshot 만 읽어 집계(DB0, env 불필요).
      #     ★ 반드시 build-snapshot 다음. 빠지면 '이 달 순위'가 영영 안 바뀌어 가장 신선해야 할
      #        기능이 제일 먼저 썩는다(죽은 사이트 증상).
      - run: npx tsx scripts/build-league.ts
      # 4c) 업데이트 로그 — 이번 주 엔트리 1줄 append(/updates 타임라인 = 살아있음 증거).
      #     ★ data-meta·league 다음. 누적 txCount 증가분을 자동 산출해 "이번 주 +N건"으로 쌓는다.
      - run: npx tsx scripts/build-update-log.ts
      # 4d) R-ONE 주간 매매가격지수 — 주간에도 갱신(일간이 실패해도 최신 유지).
      - run: npx tsx scripts/build-reb-weekly.ts
        continue-on-error: true
      # 4e) 일간 펄스도 한 번 새로(전체 재계산 직후 최근 창 재확인).
      - run: npx tsx scripts/daily-pulse.ts --gu=all --months=2

      # 5) 바뀐 데이터 JSON 만 커밋 → push 시 Vercel 자동 배포.
      #    (분양권(fetch-presale)은 변동이 드물고 호출이 무거워 제외 — 필요 시 수동.)
      - name: commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/trendIndex.json src/data/dataMeta.json src/data/complexSnapshot.json src/data/leagueTable.json src/data/updateLog.json src/data/rebWeekly.json src/data/dailyPulse.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore(data): 주간 실거래 갱신 ($(date +%Y-%m-%d))"
            git push
          fi
