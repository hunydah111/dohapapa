name: daily-data-refresh

# 매일 새벽 6시(KST) 실거래 증분 갱신 → JSON 커밋 → Vercel 자동 배포.
# 06:00 KST = 21:00 UTC (전날). 수동 실행도 가능(workflow_dispatch).
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul # 기존 KST 적재분과 dealDate·월버킷 일치 (중복 방지의 핵심)
      # 스크립트는 직결(direct) 연결을 쓴다 — 대량 삽입·트랜잭션에 pgbouncer 회피.
      DATABASE_URL: ${{ secrets.DIRECT_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
      KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate

      # 1) 매매 실거래 — 최근 2개월만 시군구별 원자적 교체(멱등). 신규 단지는 find-or-create.
      - run: npx tsx scripts/fetch-molit.ts --gu=all --refresh-recent=2
      # 2) 신규 단지만 좌표/학교거리 보강(증분, 저비용).
      - run: npx tsx scripts/geocode-complexes.ts
      - run: npx tsx scripts/enrich-schools.ts
      # 3) 번들에 박히는 JSON 재생성(추세지수 + 첫화면 갱신일).
      - run: npx tsx scripts/build-trend-index.ts
      - run: npx tsx scripts/build-data-meta.ts

      # 4) 바뀐 데이터 JSON 만 커밋 → push 시 Vercel 자동 배포.
      #    (분양권(fetch-presale)은 변동이 드물고 호출이 무거워 데일리에서 제외 — 필요 시 수동/주간.)
      - name: commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/trendIndex.json src/data/dataMeta.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore(data): 일일 실거래 갱신 ($(date +%Y-%m-%d))"
            git push
          fi
