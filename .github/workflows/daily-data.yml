name: weekly-data-refresh

# 매주 일요일 새벽 6시(KST) 실거래 증분 갱신 → 스냅샷 등 JSON 커밋 → Vercel 자동 배포.
# 일 06:00 KST = 토 21:00 UTC → cron "0 21 * * 6". 수동 실행도 가능(workflow_dispatch).
# 주 1회인 이유: MOLIT 실거래는 월 단위로 변하고, 앱이 읽는 complexSnapshot.json 이 6.6MB라
# 매일 커밋하면 깃 히스토리가 폭증한다. 주 1회면 신선도 충분 + 저장/배포 비용 절감.
on:
  schedule:
    - cron: "0 21 * * 6"
  workflow_dispatch:
    inputs:
      refresh_months:
        # 평소 2. "정화 백필"은 13 — fetch-molit 적재 규칙(2026-07-06: 해제 스킵·직거래
        # 태깅)을 과거 13개월에 소급 적용해 regionSeries "해제·직거래 제외" 각주를
        # 전 구간에서 참으로 만든다. API 호출 ~81×13이므로 필요할 때 1회만.
        description: "실거래 재적재 개월 수 (기본 2 · 해제·직거래 정화 백필은 13)"
        required: false
        default: "2"

permissions:
  contents: write

concurrency:
  group: weekly-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul # 기존 KST 적재분과 dealDate·월버킷 일치 (중복 방지의 핵심)
      # 스크립트는 직결(direct) 연결을 쓴다 — 대량 삽입·트랜잭션에 pgbouncer 회피.
      DATABASE_URL: ${{ secrets.DIRECT_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
      KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate

      # 1) 매매 실거래 — 최근 N개월(기본 2)만 시군구별 원자적 교체(멱등). 신규 단지는
      #    find-or-create. 수동 실행 시 refresh_months 로 창 확대 가능(정화 백필 13).
      - run: npx tsx scripts/fetch-molit.ts --gu=all --refresh-recent=${{ inputs.refresh_months || '2' }}
      # 2) 신규 단지만 좌표/학교거리 보강(증분, 저비용).
      - run: npx tsx scripts/geocode-complexes.ts
      - run: npx tsx scripts/enrich-schools.ts
      # 3) 번들에 박히는 JSON 재생성(추세지수 + 첫화면 갱신일).
      - run: npx tsx scripts/build-trend-index.ts
      - run: npx tsx scripts/build-data-meta.ts
      # 4) 앱이 런타임에 읽는 단지 스냅샷 재생성(Neon 에서 읽음, build-trend-index 다음).
      #    ★ 이 단계가 빠지면 갱신분이 사이트에 반영되지 않는다 — 런타임은 DB 가 아니라 이 JSON 만 읽음.
      - run: npx tsx scripts/build-snapshot.ts
      # (4b/4c 리그·업데이트로그 단계는 2026-06-11 라우트 학살로 제거)
      # 4d) R-ONE 주간 매매가격지수 — 주간에도 갱신(일간이 실패해도 최신 유지).
      - run: npx tsx scripts/build-reb-weekly.ts
        continue-on-error: true
      # 4e) 일간 펄스도 한 번 새로(전체 재계산 직후 최근 창 재확인).
      - run: npx tsx scripts/daily-pulse.ts --gu=all --months=2
      # 4f) 동네면 시계열 — 시군구 × 최근 13개월 월 버킷(거래량 + 관측 중위가).
      #     DB(fetch-molit 적재분)에서 굽는다 — fetch-molit 다음이면 언제든 OK.
      - run: npx tsx scripts/build-region-series.ts

      # 5) 바뀐 데이터 JSON 만 커밋 → push 시 Vercel 자동 배포.
      #    (분양권(fetch-presale)은 변동이 드물고 호출이 무거워 제외 — 필요 시 수동.)
      - name: commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/trendIndex.json src/data/dataMeta.json src/data/complexSnapshot.json src/data/rebWeekly.json src/data/dailyPulse.json src/data/regionSeries.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore(data): 주간 실거래 갱신 ($(date +%Y-%m-%d))"
            git push
          fi
