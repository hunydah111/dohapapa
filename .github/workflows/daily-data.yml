name: weekly-data-refresh

# 매주 일요일 새벽 6시(KST) 실거래 증분 갱신 → 스냅샷 등 JSON 커밋 → Vercel 자동 배포.
# 일 06:00 KST = 토 21:00 UTC → cron "0 21 * * 6". 수동 실행도 가능(workflow_dispatch).
# 주 1회인 이유: MOLIT 실거래는 월 단위로 변하고, 앱이 읽는 complexSnapshot.json 이 6.6MB라
# 매일 커밋하면 깃 히스토리가 폭증한다. 주 1회면 신선도 충분 + 저장/배포 비용 절감.
on:
  schedule:
    - cron: "0 21 * * 6"
  workflow_dispatch:
    inputs:
      refresh_months:
        # 평소 2. "정화 백필"은 13 — fetch-molit 적재 규칙(2026-07-06: 해제 스킵·직거래
        # 태깅)을 과거 13개월에 소급 적용해 regionSeries "해제·직거래 제외" 각주를
        # 전 구간에서 참으로 만든다. API 호출 ~81×13이므로 필요할 때 1회만.
        description: "실거래 재적재 개월 수 (기본 3 — 신고 지연 대비 · 정화 백필은 13)"
        required: false
        default: "3"
      # 온도 5년 시계열(tempSeries)용 소급 수집 — 지정 월 구간(YYYYMM)만 원자 교체(멱등·재개
      # 가능). ⚠️ MOLIT 일일 쿼터 불명 — 82구×12개월(약 1천 호출) 단위 조각 실행 권장.
      # 일일 펄스(daily-pulse.yml, 매일 82×3호출)의 쿼터를 잠식하지 않게 하루 한 조각만.
      # 예: 1차 backfill_from=202107 backfill_to=202206 → 2차 202207~202306 → …
      backfill_from:
        description: "소급 수집 시작 월 YYYYMM (backfill_to와 함께 지정 시에만 동작)"
        required: false
        default: ""
      backfill_to:
        description: "소급 수집 끝 월 YYYYMM (폐구간)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: weekly-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul # 기존 KST 적재분과 dealDate·월버킷 일치 (중복 방지의 핵심)
      # 스크립트는 직결(direct) 연결을 쓴다 — 대량 삽입·트랜잭션에 pgbouncer 회피.
      DATABASE_URL: ${{ secrets.DIRECT_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
      KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate

      # 1) 매매 실거래 — 최근 N개월(기본 2)만 시군구별 원자적 교체(멱등). 신규 단지는
      #    find-or-create. 수동 실행 시 refresh_months 로 창 확대 가능(정화 백필 13).
      - run: npx tsx scripts/fetch-molit.ts --gu=all --refresh-recent=${{ inputs.refresh_months || '2' }}
      # 1b) 온도 5년 소급 백필 — workflow_dispatch에서 backfill_from/backfill_to(YYYYMM)를
      #     지정한 회차만 실행. 그 월 구간을 시군구별 원자 교체(멱등) — 조각으로 끊어
      #     여러 번 돌려도 안전(재개 가능). 크론(schedule) 회차엔 inputs가 비어 스킵.
      #     ⚠️ MOLIT 쿼터 불명 — 82구×12개월(약 1천 호출) 조각 권장, 하루 한 조각.
      - if: ${{ inputs.backfill_from != '' && inputs.backfill_to != '' }}
        run: npx tsx scripts/fetch-molit.ts --gu=all --from=${{ inputs.backfill_from }} --to=${{ inputs.backfill_to }}
      # 2) 신규 단지만 좌표/학교거리 보강(증분, 저비용).
      - run: npx tsx scripts/geocode-complexes.ts
      - run: npx tsx scripts/enrich-schools.ts
      # 3) 번들에 박히는 JSON 재생성(추세지수 + 첫화면 갱신일).
      - run: npx tsx scripts/build-trend-index.ts
      - run: npx tsx scripts/build-data-meta.ts
      # 4) 앱이 런타임에 읽는 단지 스냅샷 재생성(Neon 에서 읽음, build-trend-index 다음).
      #    ★ 이 단계가 빠지면 갱신분이 사이트에 반영되지 않는다 — 런타임은 DB 가 아니라 이 JSON 만 읽음.
      - run: npx tsx scripts/build-snapshot.ts
      # (4b/4c 리그·업데이트로그 단계는 2026-06-11 라우트 학살로 제거)
      # 4d) R-ONE 주간 매매가격지수 — 주간에도 갱신(일간이 실패해도 최신 유지).
      - run: npx tsx scripts/build-reb-weekly.ts
        continue-on-error: true
      # 4e) 일간 펄스도 한 번 새로(전체 재계산 직후 최근 창 재확인). --months=3: 신고 지연 대비.
      - run: npx tsx scripts/daily-pulse.ts --gu=all --months=3
      # 4f) 동네면 시계열 — 시군구 × 최근 13개월 월 버킷(거래량 + 관측 중위가).
      #     DB(fetch-molit 적재분)에서 굽는다 — fetch-molit 다음이면 언제든 OK.
      #     같은 스크립트가 온도 시계열(tempSeries.json)과 [최근 거래 상위]
      #     (regionTop.json — 시군구×평형 밴드 최근 60일 TOP10)도 함께 굽는다.
      - run: npx tsx scripts/build-region-series.ts

      # 5) 바뀐 데이터 JSON 만 커밋 → push 시 Vercel 자동 배포.
      #    (분양권(fetch-presale)은 변동이 드물고 호출이 무거워 제외 — 필요 시 수동.)
      - name: commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/trendIndex.json src/data/dataMeta.json src/data/complexSnapshot.json src/data/rebWeekly.json src/data/dailyPulse.json src/data/regionSeries.json src/data/tempSeries.json src/data/regionTop.json src/data/regionPeaks.json src/data/regionChase.json src/data/regionTempSeries.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore(data): 주간 실거래 갱신 ($(date +%Y-%m-%d))"
            git pull --rebase origin master || { git rebase --abort; echo "rebase 실패 — 다음 회차가 재시도"; exit 1; }
            git push
          fi
